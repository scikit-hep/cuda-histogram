name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "37 5 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

env:
  # Many color libraries just need this to be set to any value, but at least
  # one distinguishes color depth, where "3" -> "256-bit color".
  FORCE_COLOR: 3

permissions: {}

jobs:
  pre-commit:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --hook-stage manual --all-files

  gpu-tests:
    name: CUDA ${{ matrix.cuda-version }} Python ${{ matrix.python-version }}
    needs: [pre-commit]
    # Self-hosted runners must not run code from forks.
    if: >-
      (github.event_name != 'schedule' || github.repository_owner ==
      'scikit-hep') && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: self-hosted
    permissions:
      contents: read
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        cuda-version:
          - 12
          - 13
        # Oldest and newest supported Python
        python-version:
          - "3.10"
          - "3.14"

    steps:
      - name: Clean the workspace
        run: rm -rf * .[!.]* || echo "Nothing to clean"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Test package and generate coverage report
        run:
          uvx nox -s coverage-$PYTHON_VERSION --verbose --download-python always
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          CUDA_VERSION: ${{ matrix.cuda-version }}

      - name: Upload coverage report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
