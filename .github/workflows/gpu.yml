name: GPU

on:
  schedule:
    - cron: "37 5 * * *"
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

env:
  FORCE_COLOR: 3

jobs:
  gpu-tests:
    name: CUDA ${{ matrix.cuda-version }} Python ${{ matrix.python-version }}
    # Self-hosted runners must not run code from forks.
    if: >-
      (github.event_name != 'schedule' || github.repository_owner ==
      'scikit-hep') && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: self-hosted
    timeout-minutes: 60

    # Required for micromamba to activate conda
    defaults:
      run:
        shell: bash -l {0}

    strategy:
      fail-fast: false
      matrix:
        cuda-version:
          - 12
          - 13
        # Oldest and newest supported Python
        python-version:
          - "3.10"
          - "3.14"

    steps:
      - name: Clean the workspace and micromamba
        run: |
          rm -rf * .[!.]* || echo "Nothing to clean"
          rm -rf ~/micromamba* || echo "Nothing to clean"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: test-env
          init-shell: bash
          create-args: >-
            python=${{ matrix.python-version }} cupy>=13.1 cuda-version=${{
            matrix.cuda-version }}

      - name: Install cuda-histogram and test dependencies
        # CuPy comes from conda-forge here, so no cudaNNx extra is selected.
        run: |
          python -m pip install -v . pytest pytest-github-actions-annotate-failures

      - name: Print versions
        run: python -m pip list

      - name: Run the GPU tests
        run: python -m pytest -vv -rs
